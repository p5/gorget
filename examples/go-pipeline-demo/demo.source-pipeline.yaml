fetch:
  - type: git
    repo: "./demo-repo"
    ref: "main"

transform:
  # Remove docs/ from the source tarball before it's emitted. Note this only
  # affects the *archived copy* -- it doesn't touch the live checkout that
  # vendor-pin/vendor/run operate against below.
  - type: strip-tarball
    paths:
      - "*/docs"

  - type: vendor-pin
    ecosystem: go
    pins:
      # Go module versions need the "v" prefix -- unlike npm/cargo, which
      # don't use one. Whatever minimum-version you write is passed through
      # to `go mod edit -require=<dependency>@<minimum-version>` verbatim.
      - dependency: "rsc.io/quote"
        minimum-version: "v1.5.2"

  # Re-vendor now that vendor-pin has bumped the dependency -- vendor is a
  # legal step under both fetch: and transform:, reused unchanged either way.
  - type: vendor
    ecosystem: go

  # Escape hatch: an arbitrary command, with declared outputs archived as new
  # artifacts afterward.
  - type: run
    command: ["sh", "-c", "go version > go-version.txt"]
    outputs:
      - go-version.txt

# toolchain: only *validates* against whatever's already installed -- it
# never fetches or switches versions (see gorget/toolchain.py). Uncomment
# and set `version:` to your own `go version` output (setup-demo-repo.sh
# prints the exact value) to see it pass; use a wrong version to see it fail
# closed instead. See README.md section 4.
# toolchain:
#   - name: go
#     version: 1.22.0
